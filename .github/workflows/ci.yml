# Created: 2026-10-22 12:20 -05:00 · Edited: 2026-10-22 12:20 -05:00
# ci — run, count against the floor, and the store suite on Postgres (H5). The
# upstream register checks run only when UPSTREAM_TOKEN can read the private
# turing-review repository; until then they live in the local pre-commit hook.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loomhall
          POSTGRES_PASSWORD: loomhall
          POSTGRES_DB: loomhall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOOMHALL_TEST_POSTGRES_DSN: postgres://loomhall:loomhall@localhost:5432/loomhall_test?sslmode=disable
      UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: loomhall
      - uses: actions/setup-go@v5
        with:
          go-version-file: loomhall/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: loomhall/web/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: loomhall/web
      - name: run
        run: scripts/run_tests.sh
        working-directory: loomhall
      - name: floor
        run: scripts/check_floor.sh
        working-directory: loomhall
      - name: upstream checks
        if: env.UPSTREAM_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: martin-gleason/code-process-review
          token: ${{ secrets.UPSTREAM_TOKEN }}
          path: turing-review
      - name: status, citations, register, harness
        if: env.UPSTREAM_TOKEN != ''
        working-directory: loomhall
        run: |
          python3 ../turing-review/scripts/gen_status.py . --check
          python3 ../turing-review/scripts/check_citations.py .
          python3 ../turing-review/scripts/check_register.py docs/plans/00-register.md
          python3 ../turing-review/scripts/check_harness.py --run .
